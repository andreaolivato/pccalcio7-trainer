name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    # Publishing a release needs write access to contents. The default token is
    # read-only, which makes the build pass and only the release step fail.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build with the in-box C# compiler
        shell: cmd
        run: build.cmd

      - name: Show what was produced
        shell: pwsh
        run: Get-ChildItem dist | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: PcCalcio7Trainer
          path: |
            dist/PcCalcio7Trainer.exe
            dist/SelfTest.exe

      # Tagging v1.0.0 publishes a release with the exe attached.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PcCalcio7Trainer.exe
            dist/SelfTest.exe
          body: |
            Download **PcCalcio7Trainer.exe** and run it. Nothing to install.

            Start PC Calcio 7 and load your career first. Windows may warn about an
            unknown publisher, and antivirus may flag it: the trainer writes to the
            game's memory, which looks like malware to a heuristic scanner. The full
            source is in this repository if you would rather build it yourself.
